<!DOCTYPE html>
<html>
<head>
  <title>Cursed Countdown</title>
  <link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: black;
      color: white;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 30px;
    }

    #countdown {
      font-size: 60px;
      color: red;
    }

    .creepy-text {
      font-family: 'Nosifer', cursive;
      font-size: 50px;
      color: red;
      margin-top: 40px;
      display: none;
    }

    footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      color: gray;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>The countdown has begun...</h1>
  <div id="countdown">30</div>
  <div class="creepy-text" id="creepyText">RUN RUN RUN!!!</div>

  <footer>
    Made by Hasnain Abbasi
  </footer>

  <script>
    let timeLeft = 30;
    const countdownEl = document.getElementById("countdown");
    const creepyText = document.getElementById("creepyText");

    const timer = setInterval(() => {
      timeLeft--;
      countdownEl.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timer);
        countdownEl.style.display = "none";
        creepyText.style.display = "block";
      }
    }, 1000);
  </script>

</body>
</html>
